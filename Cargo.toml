[package]
name = "storage-engines"
version = "0.4.0"
edition = "2024"
description = "四个教学用 KV 存储引擎(LSM 树 / B+ 树 / Bitcask / 纯内存),共享同一套 MVCC 事务层与统一 trait 门面,可在运行时按名字切换引擎。Four educational key-value storage engines behind one MVCC transaction layer and a runtime-selectable trait facade."
license = "MIT OR Apache-2.0"
repository = "https://github.com/chjgfg/storage-engines"
readme = "README.md"
keywords = ["storage-engine", "lsm-tree", "btree", "bitcask", "mvcc"]
categories = ["database-implementations", "data-structures"]

# 发布包里不带演示产物与本地配置。data/ 由 tests/ 自行生成。
exclude = [
    "data/",
    ".claude/",
    "bitcask_mvcc_demo/",
    "lsm_mvcc_demo/",
]

[dependencies]
log = "0.4.21"
fs4 = "0.8.2"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
memmap2 = "0.9"

[profile.release]
lto = true
codegen-units = 1

# ── 可执行文件 ────────────────────────────────────────────────────────────
#
# 门面层示例
[[bin]]
name = "storage-engines"
path = "src/main.rs"

# 压测工具仍按引擎各留一份（它们的主体是各家自己的 bulk 灌法，没有可共用的外壳）。
# Cargo 不认 src/<模块>/bin/ 这个路径，必须显式声明。
#
# 数据搬运在 M81 收成**一对**：`--engine` 选家，四家同一条读写路径（实体在
# `src/tools/bin/`）。原先那八条 `<引擎>-{import,export}-kv` 已删 —— 它们调的就是
# 同一个 `tools::{export_to_dir, import_from_dir}`，参数解析各抄一份正是"基座被复制"。
#
#   cargo run --release --bin export-kv -- --engine bitcask --dir ./db --out snap.bin
#   cargo run --release --bin import-kv -- --engine lsm_tree --dir ./lsm --in snap.bin

[[bin]]
name = "export-kv"
path = "src/tools/bin/export_kv.rs"

[[bin]]
name = "import-kv"
path = "src/tools/bin/import_kv.rs"

[[bin]]
name = "bitcask-bench-bulk"
path = "src/bitcask/bin/bench_bulk.rs"



[[bin]]
name = "bplus-bench"
path = "src/bplus_tree/bin/bench.rs"



[[bin]]
name = "lsm-bench-bulk"
path = "src/lsm_tree/bin/bench_bulk.rs"



[[bin]]
name = "memory-bench"
path = "src/memory/bin/bench.rs"

