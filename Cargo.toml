[package]
name = "storage-engines"
version = "0.5.1"
edition = "2024"
default-run = "storage-engines"
description = "四个教学用 KV 存储引擎(LSM 树 / B+ 树 / Bitcask / 纯内存),共享同一套 MVCC 事务层与统一 trait 门面,可在运行时按名字切换引擎。Four educational key-value storage engines behind one MVCC transaction layer and a runtime-selectable trait facade."
license = "MIT OR Apache-2.0"
repository = "https://github.com/chjgfg/storage-engines"
readme = "README.md"
keywords = ["storage-engine", "lsm-tree", "btree", "bitcask", "mvcc"]
categories = ["database-implementations", "data-structures"]

# 发布包里不带演示产物与本地配置。测试目录位于 target/test-data/。
exclude = [
    "data/",
    ".claude/",
    ".zcode/",
    "bitcask_mvcc_demo/",
    "lsm_mvcc_demo/",
    # 本地工作笔记，不进发布包（git 里仍未跟踪，想入库另说）
    "findings.md",
    "progress.md",
    "task_plan.md",
]

[features]
default = []
web = ["dep:serde_json", "dep:tokio", "dep:axum"]

[dependencies]
log = "0.4.21"
fs4 = "0.8.2"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
memmap2 = "0.9"
# 仅 Web 外壳使用；默认库与 shell 不编译 HTTP/异步运行时。
serde_json = { version = "1.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
axum = { version = "0.8", features = ["json"], optional = true }

[profile.release]
lto = true
codegen-units = 1

# ── 可执行文件 ────────────────────────────────────────────────────────────
#
# 门面示例为默认运行入口；Web 入口需要显式启用 feature。
[[bin]]
name = "storage-engines"
path = "src/main.rs"

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]

# 其余可执行文件全在 `src/bin/`，走 Cargo 自动发现：**文件名就是 bin 名**（带连字符），
# 不再写 `[[bin]] path = …`（M82：原先散在 `src/<模块>/bin/` 下，那种路径 Cargo 不认才逐条声明）。
#
#   export-kv / import-kv       数据搬运，一对 CLI，`--engine` 选家，四家同一条读写路径
#                                （搬运逻辑只有一份：`tools::{export_to_dir, import_from_dir}`）
#   bitcask-bench-bulk / bplus-bench / lsm-bench-bulk / memory-bench
#                                压测工具按引擎各留一份（主体是各家自己的 bulk 灌法，没有可共用的外壳）
#   shell / web                 KV 终端一对：shell 是交互式 REPL，web 是浏览器里的 DOS 风格终端
#                                （命令解释器只有一份：`terminal::{run_line}`，两个外壳都只做壳）
#
#   cargo run --release --bin export-kv -- --engine bitcask --dir ./db --out snap.bin
#   cargo run --release --bin import-kv -- --engine lsm_tree --dir ./lsm --in snap.bin
#   cargo run --release --bin shell    -- --engine lsm --dir ./data/lsm
#   cargo run --release --features web --bin web      -- --engine memory --port 8080
